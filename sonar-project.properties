sonar.projectKey=Maltiti-A-Enterprise-Ltd_maltiti_frontend
sonar.organization=maltiti-a-enterprise-ltd

# `app/api` is generated by @hey-api/openapi-ts from the backend's OpenAPI
# schema — see openapi-ts.config.ts. Generated clients repeat themselves by
# construction: every endpoint produces a near-identical request wrapper, and
# every DTO a near-identical type. Measuring that as duplication fails the
# quality gate on the size of the API rather than on anything anyone wrote,
# and the only way to "fix" it would be to hand-edit a file the next
# regeneration overwrites.
#
# Duplication only. The generated code is still analysed for bugs and
# vulnerabilities, which are worth knowing about wherever they come from.
sonar.cpd.exclusions=app/api/**
